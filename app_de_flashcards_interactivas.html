<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards de Terapia de Lenguaje</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0fdf4; /* Un verde muy suave, relajante para terapia */
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .perspective {
            perspective: 1000px;
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }

        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 1.5rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background-color: white;
            border: 4px solid #e5e7eb;
        }

        .flip-card-front {
            border-color: #3b82f6; /* Borde azul para el frente */
        }

        .flip-card-back {
            background-color: #eff6ff;
            border-color: #10b981; /* Borde verde para la parte trasera (éxito) */
            transform: rotateY(180deg);
        }

        /* Utilidad para evitar selección de texto rápida al hacer muchos clics */
        .no-select {
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body class="text-gray-800">

    <header class="bg-white shadow-sm p-4 sticky top-0 z-10">
        <div class="max-w-3xl mx-auto flex justify-between items-center">
            <h1 class="text-xl md:text-2xl font-bold text-blue-600">
                <i class="fas fa-comment-medical mr-2"></i>Terapia de Lenguaje
            </h1>
            <div class="flex items-center space-x-4">
                <span id="counter" class="text-lg font-semibold text-gray-600 bg-gray-100 px-3 py-1 rounded-full">1 / 50</span>
            </div>
        </div>
    </header>

    <main class="flex-grow flex flex-col items-center justify-center p-4">
        
        <!-- Contenedor principal de la carta -->
        <div class="w-full max-w-sm aspect-[3/4] perspective flip-card mb-8 no-select" id="flashcard" onclick="toggleFlip()">
            <div class="flip-card-inner">
                <!-- Parte Frontal (Imagen/Emoji) -->
                <div class="flip-card-front">
                    <div id="front-image" class="text-9xl md:text-[10rem] filter drop-shadow-md transition-transform duration-300 hover:scale-110">
                        <!-- La imagen se inyecta por JS -->
                    </div>
                    <p class="mt-8 text-gray-400 font-medium text-sm flex items-center">
                        <i class="fas fa-hand-pointer mr-2"></i> Toca para voltear
                    </p>
                </div>
                <!-- Parte Trasera (Palabra Escrita) -->
                <div class="flip-card-back">
                    <h2 id="back-word" class="text-5xl md:text-6xl font-extrabold text-gray-800 break-words text-center">
                        <!-- La palabra se inyecta por JS -->
                    </h2>
                    
                    <!-- Botón para reproducir el audio de la palabra -->
                    <button onclick="speakWord(event)" class="mt-8 bg-blue-100 hover:bg-blue-200 text-blue-600 p-4 rounded-full transition-colors shadow-sm focus:outline-none focus:ring-4 focus:ring-blue-300" title="Escuchar pronunciación">
                        <i class="fas fa-volume-up text-3xl"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Controles de navegación -->
        <div class="w-full max-w-sm flex justify-between items-center px-4 space-x-4">
            <button onclick="prevCard()" class="flex-1 bg-white hover:bg-gray-50 border-2 border-gray-200 text-gray-700 font-bold py-3 px-4 rounded-xl shadow-sm transition-colors focus:outline-none focus:ring-2 focus:ring-blue-400">
                <i class="fas fa-chevron-left mr-2"></i> Anterior
            </button>
            <button onclick="shuffleCards()" class="bg-purple-100 hover:bg-purple-200 text-purple-600 p-3 rounded-xl shadow-sm transition-colors focus:outline-none focus:ring-2 focus:ring-purple-400" title="Revolver cartas aleatoriamente">
                <i class="fas fa-random text-xl"></i>
            </button>
            <button onclick="nextCard()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl shadow-sm transition-colors focus:outline-none focus:ring-2 focus:ring-blue-400">
                Siguiente <i class="fas fa-chevron-right ml-2"></i>
            </button>
        </div>
        
    </main>

    <script>
        // Base de datos de 50 flashcards divididas por categorías comunes
        const originalCards = [
            // Animales
            { word: "Perro", image: "🐶" },
            { word: "Gato", image: "🐱" },
            { word: "Vaca", image: "🐮" },
            { word: "Cerdo", image: "🐷" },
            { word: "Caballo", image: "🐴" },
            { word: "Oveja", image: "🐑" },
            { word: "Pato", image: "🦆" },
            { word: "Gallina", image: "🐔" },
            { word: "Pez", image: "🐟" },
            { word: "Pájaro", image: "🐦" },
            { word: "León", image: "🦁" },
            { word: "Elefante", image: "🐘" },
            { word: "Rana", image: "🐸" },
            { word: "Mono", image: "🐵" },
            { word: "Mariposa", image: "🦋" },
            
            // Alimentos
            { word: "Manzana", image: "🍎" },
            { word: "Plátano", image: "🍌" },
            { word: "Naranja", image: "🍊" },
            { word: "Fresa", image: "🍓" },
            { word: "Uvas", image: "🍇" },
            { word: "Sandía", image: "🍉" },
            { word: "Leche", image: "🥛" },
            { word: "Agua", image: "💧" },
            { word: "Pan", image: "🍞" },
            { word: "Queso", image: "🧀" },
            { word: "Huevo", image: "🥚" },
            { word: "Zanahoria", image: "🥕" },
            { word: "Tomate", image: "🍅" },
            { word: "Helado", image: "🍦" },
            { word: "Galleta", image: "🍪" },
            
            // Objetos de la Casa
            { word: "Cama", image: "🛏️" },
            { word: "Puerta", image: "🚪" },
            { word: "Televisión", image: "📺" },
            { word: "Teléfono", image: "☎️" },
            { word: "Reloj", image: "⌚" },
            { word: "Silla", image: "🪑" },
            { word: "Cuchara", image: "🥄" },
            { word: "Tenedor", image: "🍴" },
            { word: "Vaso", image: "🥤" },
            { word: "Regalo", image: "🎁" },
            
            // Ropa y Accesorios
            { word: "Camisa", image: "👕" },
            { word: "Pantalón", image: "👖" },
            { word: "Vestido", image: "👗" },
            { word: "Zapatos", image: "👞" },
            { word: "Calcetines", image: "🧦" },
            
            // Transporte y Naturaleza
            { word: "Coche", image: "🚗" },
            { word: "Avión", image: "✈️" },
            { word: "Bicicleta", image: "🚲" },
            { word: "Sol", image: "☀️" },
            { word: "Luna", image: "🌙" }
        ];

        let cards = [...originalCards];
        let currentIndex = 0;
        let isFlipped = false;

        // Referencias al DOM
        const cardElement = document.getElementById('flashcard');
        const frontImage = document.getElementById('front-image');
        const backWord = document.getElementById('back-word');
        const counter = document.getElementById('counter');

        // Función para renderizar la tarjeta actual en la pantalla
        function renderCard() {
            // Asegurarnos de que la carta esté mostrando la parte frontal al cambiar
            if (isFlipped) {
                cardElement.classList.remove('flipped');
                isFlipped = false;
                
                // Esperar a que termine la animación de vuelta para cambiar el contenido
                setTimeout(() => {
                    updateCardContent();
                }, 300); // La mitad del tiempo de la transición CSS
            } else {
                updateCardContent();
            }
        }

        // Función auxiliar para actualizar el texto y la imagen
        function updateCardContent() {
            const currentCard = cards[currentIndex];
            frontImage.textContent = currentCard.image;
            backWord.textContent = currentCard.word;
            counter.textContent = `${currentIndex + 1} / ${cards.length}`;
        }

        // Voltear la carta
        function toggleFlip() {
            isFlipped = !isFlipped;
            if (isFlipped) {
                cardElement.classList.add('flipped');
                // Opcional: Pronunciar la palabra automáticamente al voltear. 
                // Descomenta la siguiente línea si deseas ese comportamiento.
                // speakWord(); 
            } else {
                cardElement.classList.remove('flipped');
            }
        }

        // Navegar a la carta anterior
        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
            } else {
                currentIndex = cards.length - 1; // Bucle al final
            }
            renderCard();
        }

        // Navegar a la siguiente carta
        function nextCard() {
            if (currentIndex < cards.length - 1) {
                currentIndex++;
            } else {
                currentIndex = 0; // Bucle al inicio
            }
            renderCard();
        }

        // Mezclar las cartas aleatoriamente
        function shuffleCards() {
            // Algoritmo de Fisher-Yates para mezclar arreglos
            for (let i = cards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [cards[i], cards[j]] = [cards[j], cards[i]];
            }
            currentIndex = 0;
            renderCard();
            
            // Efecto visual rápido para indicar que se mezclaron
            const shuffleBtn = document.querySelector('.fa-random').parentElement;
            shuffleBtn.classList.add('animate-pulse', 'bg-purple-300');
            setTimeout(() => {
                shuffleBtn.classList.remove('animate-pulse', 'bg-purple-300');
            }, 500);
        }

        // Sintetizador de voz para pronunciar la palabra
        function speakWord(event) {
            // Evitar que el clic en el botón de audio voltee la carta nuevamente
            if(event) {
                event.stopPropagation();
            }

            const currentWord = cards[currentIndex].word;
            
            // Verificar si el navegador soporta síntesis de voz
            if ('speechSynthesis' in window) {
                // Cancelar cualquier audio reproduciéndose actualmente
                window.speechSynthesis.cancel();
                
                const utterance = new SpeechSynthesisUtterance(currentWord);
                
                // Configurar el idioma a español (es-MX dado el contexto de México, o es-ES)
                utterance.lang = 'es-MX';
                
                // Reducir un poco la velocidad para que sea más clara en terapia
                utterance.rate = 0.85; 
                utterance.pitch = 1.0;

                window.speechSynthesis.speak(utterance);
            } else {
                console.warn("La síntesis de voz no está soportada en este navegador.");
            }
        }

        // Soporte para navegación con teclado (Flechas izquierda/derecha y Espacio)
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') {
                nextCard();
            } else if (e.key === 'ArrowLeft') {
                prevCard();
            } else if (e.key === ' ' || e.key === 'Spacebar') {
                e.preventDefault(); // Evitar scroll de la página
                toggleFlip();
            }
        });

        // Inicializar la aplicación al cargar
        window.onload = () => {
            renderCard();
        };
    </script>
</body>
</html>
